services:
  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: we-mp-rss-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: we-mp-rss-singbox
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SINGBOX_INBOUND_PORT: 7890
      SINGBOX_LOG_LEVEL: info
    entrypoint:
      - /bin/sh
      - /etc/sing-box/run-singbox.sh
    volumes:
      - ./singbox/run-singbox.sh:/etc/sing-box/run-singbox.sh:ro

  we-mp-rss:
    image: rachelos/we-mp-rss:latest
    container_name: we-mp-rss
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # 默认 SQLite，数据在 ./data/db.db；迁移 MySQL 时设 DB 环境变量即可
      REDIS_URL: redis://redis:6379/0
      PROXY_HTTP_URL: http://singbox:7890
      WERSS_AUTH_WEB: "True"
    ports:
      - "8001:8001"
    volumes:
      - ../data:/app/data
      - ../apis:/app/apis
      - ../config.yaml:/app/config.yaml
    depends_on:
      - redis
      - singbox

volumes:
  redis_data:
